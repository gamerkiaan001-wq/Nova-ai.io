<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI - Smart Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>Nova AI 🤖</h2>
            <p>Aapki madad ke liye taiyar</p>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">
                Hello! Main Nova AI hoon. Aaj main aapki kya madad kar sakta hoon?
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Yahan apna message likhein..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <!-- Main JavaScript File -->
    <script src="script.js"></script>

    <!-- Mobile Console (Eruda Inspector) -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</body>
</html>
